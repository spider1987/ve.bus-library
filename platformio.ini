; PlatformIO project configuration for the VEBus library + basic_ess example.
;
; Board: LilyGo T-CAN485 (ESP32 Dev Module, 4 MB flash)
; This file lives at the library root so you can open the folder directly
; in VS Code / PlatformIO IDE and hit Build/Upload right away.
;
; lib_extra_dirs = .   →  PlatformIO finds the VEBus library here at the root
; src_dir           →  the example sketch to compile

[platformio]
default_envs = basic_ess

; Shared settings for all examples
[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs  = .
board_build.partitions = min_spiffs.csv

; --- Basic ESS: serial console control, no WiFi ---
[env:basic_ess]
build_src_filter = -<*> +<../examples/basic_ess/>

; --- MQTT → Home Assistant auto-discovery ---
[env:mqtt_ha]
build_src_filter = -<*> +<../examples/mqtt_ha/>
lib_deps =
    knolleary/PubSubClient@^2.8
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    adafruit/Adafruit NeoPixel@1.12.3
    bblanchon/ArduinoJson@6.21.5

; Normal Web UI with a bus-level allowlist of read requests only.
[env:mqtt_ha_readonly]
extends = env:mqtt_ha
build_flags = -D VEBUS_READ_ONLY=1

; Control build: start at zero, no restored USV mode or VE.Bus auto-wakeup.
[env:mqtt_ha_control_test]
extends = env:mqtt_ha
build_flags = -D VEBUS_CONTROL_TEST=1

; --- MQTT example, flashed over the network (OTA via the web UI) ---
; pio run -e mqtt_ha_ota -t upload --upload-port <device-ip or name.local>
; Admin password is taken from the VEBUS_ADMIN_PASS environment variable.
[env:mqtt_ha_ota]
extends = env:mqtt_ha
upload_protocol = custom
upload_port = vebus-multiplus.local
upload_command = curl -f -u admin:${sysenv.VEBUS_ADMIN_PASS} -F "firmware=@$SOURCE" http://$UPLOAD_PORT/admin/update

; --- Minimal network UPS (NUT + apcupsd), no MQTT/web UI ---
[env:ups_server]
build_src_filter = -<*> +<../examples/ups_server/>

; --- Raw RS485 test (hardware debugging) ---
[env:raw_test]
build_src_filter = -<*> +<../examples/raw_test/>
